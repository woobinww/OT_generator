name: Deploy attendance server

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: attendance-server-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout pushed commit
        uses: actions/checkout@v5

      - name: Validate and restart PM2 process
        shell: powershell -ExecutionPolicy Bypass -File {0}
        run: |
          Set-Location $env:GITHUB_WORKSPACE

          $nodePaths = @(
            "$env:ProgramFiles\nodejs",
            "$env:APPDATA\npm",
            "$env:LOCALAPPDATA\Programs\nodejs"
          ) | Where-Object { Test-Path -LiteralPath $_ }
          $env:Path = (($nodePaths + $env:Path) -join ';')

          $npmCommand = Get-Command npm.cmd -ErrorAction SilentlyContinue
          $pm2Command = Get-Command pm2.cmd -ErrorAction SilentlyContinue
          if (-not $npmCommand -or -not $pm2Command) {
            Write-Host "PATH=$env:Path"
            throw 'Node.js/npm 또는 PM2를 찾지 못했습니다. self-hosted runner 서비스 계정에 설치되어 있는지 확인하세요.'
          }

          npm.cmd run check
          if ($LASTEXITCODE -ne 0) {
            throw 'JavaScript syntax check failed.'
          }

          # Refresh the app definition from this checkout. This preserves PM2's
          # existing log handles while updating script/cwd to the pushed commit.
          pm2.cmd startOrRestart ecosystem.config.cjs --update-env
          if ($LASTEXITCODE -ne 0) {
            throw 'PM2 process start failed.'
          }

          pm2.cmd save
          pm2.cmd status

          $ready = $false
          for ($attempt = 1; $attempt -le 10; $attempt++) {
            try {
              $response = Invoke-WebRequest -UseBasicParsing -TimeoutSec 5 http://127.0.0.1:3000
              if ($response.StatusCode -eq 200) {
                $ready = $true
                break
              }
            } catch {
              Write-Host "Waiting for server ($attempt/10)..."
            }
            Start-Sleep -Seconds 2
          }
          if (-not $ready) {
            throw 'Local health check failed after waiting for PM2 process.'
          }
          $health = (Invoke-WebRequest -UseBasicParsing http://127.0.0.1:3000/api/health).Content | ConvertFrom-Json
          if (-not $health.features.otSplit -or -not $health.features.backups) {
            throw '새 기능(OT 분리 또는 백업)이 실행 중인 서버에 반영되지 않았습니다.'
          }

          Write-Host "Deployed commit: $env:GITHUB_SHA"
