<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>내 근무·근태 조회</title>
    <link rel="stylesheet" href="./user.css">
  </head>
  <body>
    <header class="user-topbar">
      <div>
        <p class="eyebrow">영상의학과 근무·근태 관리</p>
        <h1>내 근무·근태 조회</h1>
      </div>
      <div class="user-topbar-actions">
        <button id="changePasswordToggleButton" class="utility-icon-button" type="button" aria-label="비밀번호 변경" title="비밀번호 변경">⚿</button>
        <button id="logoutButton" class="utility-icon-button" type="button" aria-label="로그아웃" title="로그아웃">↪</button>
      </div>
    </header>

    <main class="user-layout">
      <section id="loginPanel" class="panel">
        <form id="loginForm">
          <p class="eyebrow">로그인</p>
          <h2>계정으로 접속</h2>
          <label>
            사용자 ID
            <input id="usernameInput" type="text" autocomplete="username">
          </label>
          <label>
            비밀번호
            <input id="passwordInput" type="password" autocomplete="current-password">
          </label>
          <button id="loginButton" class="primary" type="submit">로그인</button>
        </form>
      </section>

      <section id="summaryPanel" class="panel hidden">
        <div class="section-row">
          <div>
            <h2 id="summaryTitle">내 근태 요약</h2>
          </div>
          <div class="month-controls" aria-label="월 이동">
            <button id="previousMonthButton" type="button" aria-label="이전 달">‹</button>
            <input id="monthInput" type="month" aria-label="조회 월">
            <button id="todayMonthButton" type="button">today</button>
            <button id="nextMonthButton" type="button" aria-label="다음 달">›</button>
          </div>
        </div>
        <div id="summaryCards" class="summary-grid"></div>
      </section>

      <section id="passwordPanel" class="panel hidden">
        <div class="section-row">
          <div>
            <p class="eyebrow">계정 관리</p>
            <h2>내 비밀번호 변경</h2>
          </div>
        </div>
        <div class="password-grid">
          <label>
            현재 비밀번호
            <input id="currentPasswordInput" type="password" autocomplete="current-password">
          </label>
          <label>
            새 비밀번호
            <input id="newPasswordInput" type="password" autocomplete="new-password">
          </label>
        </div>
        <button id="changePasswordButton" class="primary" type="button">비밀번호 변경</button>
        <p class="guide-text muted">로그인한 본인 계정의 비밀번호만 바꿀 수 있습니다.</p>
      </section>

      <section id="calendarPanel" class="panel hidden">
        <div class="section-row calendar-heading-row">
          <div>
            <h2 id="calendarTitle">근무 달력</h2>
          </div>
          <div class="calendar-actions">
            <span id="lastUpdatedText" class="last-updated" aria-live="polite"></span>
            <button id="reloadButton" class="reload-icon-button" type="button" aria-label="새로고침" title="새로고침">↻</button>
          </div>
        </div>
        <div class="attendance-mode-switch" role="group" aria-label="달력 표시 모드">
          <button id="allAttendanceButton" class="primary" type="button" aria-pressed="true">전체 근무표</button>
          <button id="myAttendanceButton" type="button" aria-pressed="false">내 근태</button>
        </div>
        <div class="calendar-weekdays">
          <span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span>
        </div>
        <p id="calendarLoading" class="loading hidden" role="status">달력 데이터를 불러오는 중입니다…</p>
        <div id="calendarGrid" class="calendar-grid"></div>
      </section>

      <p id="messageBox" class="message hidden"></p>
    </main>

    <script src="./user.js"></script>
  </body>
</html>
